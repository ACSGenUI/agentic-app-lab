<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Content Carousel</title>
</head>
<body>
  <main class="main">
    <header class="header">
      <h1 class="title">Product List</h1>
      <p class="subtitle">Browse the latest products and promotions.</p>
    </header>
    <div id="filter-row" class="filter-row" hidden>
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </span>
        <input type="text" id="keywords-input" class="keywords-input" placeholder="Search documentation, metadata, or authors..." aria-label="Search documentation">
      </div>
      <button type="button" id="filter-btn" class="btn-filter">
        <span class="btn-filter-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="9" y2="18"/><circle cx="18" cy="6" r="2"/></svg>
        </span>
        Filter
      </button>
    </div>
    <div id="loader" class="loader" hidden role="status" aria-live="polite" aria-busy="false" aria-label="Loading content">
      <div class="loader-spinner" aria-hidden="true"></div>
      <p class="loader-text">Loading content…</p>
    </div>
    <div id="carousel-container" class="carousel-container" aria-label="Content cards carousel">
      <div id="carousel-track" class="carousel-track"></div>
    </div>
    <div id="load-more-row" class="load-more-row" hidden>
      <p id="load-more-label" class="load-more-label" aria-live="polite"></p>
      <button type="button" id="load-more-btn" class="btn-load-more">Load more</button>
    </div>
    <p id="empty-message" class="empty-message" hidden>No cards to show. Invoke the tool with a data endpoint (and optional keywords).</p>
    <p id="error-message" class="error-message" hidden></p>
  </main>
  <script type="module" src="./product-list.ts"></script>
</body>
</html>
